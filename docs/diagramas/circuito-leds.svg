  <path d="M485 486 L507 486 L515 493 L531 479 L547 493 L563 479 L579 493 L595 479 L611 493 L627 479 L635 486 L657 486" class="linea"/>
  <text x="570" y="466" class="etiqueta" text-anchor="middle">220 Ω</text>
  <text x="570" y="514" class="nota" text-anchor="middle">b35 → b30</text>
  <path d="M657 486 H769" class="cable dig" data-conexion="b30 ↔ a30"/>
