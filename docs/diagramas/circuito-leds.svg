  <path d="M769 486 H777 M777 475 L799 486 L777 497 Z M800 473 V499 M800 486 H811" class="linea" style="fill:#68bc89"/><path d="M782 469 l12 -12 m-7 0 h7 v7 M795 471 l12 -12 m-7 0 h7 v7" class="flecha"/>
