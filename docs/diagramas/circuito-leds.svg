  <text x="253" y="585" class="etiqueta" text-anchor="end">GND</text>
  <text x="1090" y="608" class="nota" text-anchor="end">Riel azul izquierdo</text>
  <rect x="54" y="651" width="1091" height="77" rx="12" class="notaCaja"/><text x="71" y="677" class="etiqueta" text-anchor="start">Polaridad y retorno común</text><text x="71" y="702" class="nota" text-anchor="start">Cada GPIO conduce al ánodo a través de su propia resistencia; los cátodos vuelven a GND por el riel azul.</text>
