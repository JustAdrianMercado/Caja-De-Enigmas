  <text x="253" y="378" class="etiqueta" text-anchor="end">D26 / GPIO26</text>
  <circle cx="275" cy="372" r="5" class="borne"/>
  <text x="327" y="349" class="etiqueta" text-anchor="start">Amarillo</text>
  <path d="M281 372 H485" class="cable dig" data-conexion="D26 / GPIO26 → c25"/>
