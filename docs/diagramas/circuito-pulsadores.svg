<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="868" viewBox="0 0 1200 868" role="img" aria-labelledby="titulo descripcion">
  <title id="titulo">Circuito de los pulsadores — Caja de los Enigmas</title>
  <desc id="descripcion">Rojo GPIO13, amarillo GPIO14, verde RX2 GPIO16 e inicio TX2 GPIO17. Patas de señal e40/f40, e45/f45, e50/f50, e55/f55 y patas de retorno e42/f42, e47/f47, e52/f52, e57/f57. La señal llega por c40, c45, c50 o c55. El retorno sale de h42, h47, h52 o h57 al riel azul. Los contactos se muestran en reposo, abiertos.</desc>
  <defs><style>
    text{font-family:"Segoe UI",Arial,sans-serif;fill:#172c43}
    .sobre{font-size:14px;font-weight:700;letter-spacing:1.8px;fill:#276394}
    .titulo{font-size:33px;font-weight:700}
    .subtitulo{font-size:16px;fill:#50647a}
    .nombre{font-size:22px;font-weight:700}
    .etiqueta{font-size:17px;font-weight:700}
    .texto{font-size:17px}
    .nota{font-size:15px;fill:#50647a}
    .pequena{font-size:13px;fill:#50647a}
    .micro{font-size:11px;font-weight:700;fill:#425c74}
    .leyenda{font-size:14px;fill:#334e66}
    .marco{fill:#fff;stroke:#d1dce6;stroke-width:1.5}
    .dispositivo{fill:#f6faff;stroke:#3975a7;stroke-width:2}
    .notaCaja{fill:#f6f9fc;stroke:#d1dce6;stroke-width:1.4}
    .placa{fill:#f7f9fc;stroke:#afc2d3;stroke-width:1.7}
    .canal{fill:#e8eff5}
    .fisico{fill:#e6eff9;stroke:#385572;stroke-width:1.6}
    .linea,.flecha,.cable,.puente,.tira{fill:none;stroke-linecap:round;stroke-linejoin:round}
    .linea{stroke:#172c43;stroke-width:2.6}
    .flecha{stroke:#172c43;stroke-width:1.5}
    .cable{stroke-width:3.5}
    .puente{stroke:#fff;stroke-width:7}
    .tira{stroke-width:1.8;stroke-dasharray:3 3}
    .borne{fill:#fff;stroke:#172c43;stroke-width:2}
    .orificio{fill:#fff;stroke:#b3c3d2;stroke-width:1}
    .vin{stroke:#c32e3d}.gnd{stroke:#243c59}.v3{stroke:#7850a5}
    .pwm{stroke:#b85c12}.dig{stroke:#276ba6}.eco{stroke:#9f3272}
    .red{stroke:#087b70}.adc{stroke:#227145}.usb{stroke:#3769ad;stroke-dasharray:6 5}
  </style></defs>
  <rect width="1200" height="868" fill="#fff"/>
  <text x="48" y="34" class="sobre" text-anchor="start">SIS-234  /  PRÁCTICA 4  /  MANDOS</text>
  <text x="48" y="75" class="titulo" text-anchor="start">Circuito de los pulsadores</text>
  <text x="48" y="104" class="subtitulo" text-anchor="start">Cuatro contactos táctiles de 4 patas · Cruzan el canal central de la protoboard 1</text>
  <path d="M48 121 H1152" class="tira" stroke="#aebfce"/>
  <rect x="54" y="154" width="228" height="529" rx="12" class="dispositivo"/><text x="74" y="188" class="nombre" text-anchor="start">ESP32</text><text x="74" y="211" class="nota" text-anchor="start">DOIT DevKit V1</text>
  <rect x="307" y="154" width="838" height="529" rx="12" class="marco"/>
  <text x="329" y="184" class="sobre" text-anchor="start">PROTOBOARD 1 · contactos normalmente abiertos</text>
  <text x="329" y="209" class="nota" text-anchor="start">Las dos patas de cada fila forman un polo: señal arriba y GND abajo.</text>
  <circle cx="282" cy="255" r="5" class="borne"/>
  <text x="263" y="260" class="etiqueta" text-anchor="end">D13 / GPIO13</text>
  <path d="M288 255 H602" class="cable dig" data-conexion="D13 / GPIO13 → c40 ↔ e40"/>
  <text x="331" y="241" class="etiqueta" text-anchor="start">Rojo</text>
  <text x="410" y="281" class="nota" text-anchor="middle">c40</text>
  <path d="M602 255 H743" class="cable dig" data-conexion="e40 ↔ f40 (polo de señal)"/>
  <path d="M602 291 H743" class="cable gnd" data-conexion="e42 ↔ f42 (polo GND)"/>
  <path d="M673 255 L700 283" class="linea"/><circle cx="673" cy="255" r="4" class="borne"/><circle cx="673" cy="291" r="4" class="borne"/>
  <circle cx="602" cy="255" r="4" class="borne"/>
  <circle cx="743" cy="255" r="4" class="borne"/>
  <circle cx="602" cy="291" r="4" class="borne"/>
  <circle cx="743" cy="291" r="4" class="borne"/>
  <text x="588" y="244" class="pequena" text-anchor="end">e40</text>
  <text x="588" y="296" class="pequena" text-anchor="end">e42</text>
  <text x="757" y="244" class="pequena" text-anchor="start">f40</text>
  <text x="757" y="283" class="pequena" text-anchor="start">f42</text>
  <path d="M748 291 H1103" class="cable gnd" data-conexion="f42 ↔ h42 → riel azul izquierdo"/>
  <circle cx="937" cy="291" r="4" fill="#243c59" stroke="none" stroke-width="2"/>
  <text x="937" y="315" class="nota" text-anchor="middle">h42</text>
  <circle cx="1103" cy="291" r="4" fill="#243c59" stroke="none" stroke-width="2"/>
  <circle cx="282" cy="354" r="5" class="borne"/>
  <text x="263" y="359" class="etiqueta" text-anchor="end">D14 / GPIO14</text>
  <path d="M288 354 H602" class="cable dig" data-conexion="D14 / GPIO14 → c45 ↔ e45"/>
  <text x="331" y="340" class="etiqueta" text-anchor="start">Amarillo</text>
  <text x="410" y="380" class="nota" text-anchor="middle">c45</text>
  <path d="M602 354 H743" class="cable dig" data-conexion="e45 ↔ f45 (polo de señal)"/>
  <path d="M602 390 H743" class="cable gnd" data-conexion="e47 ↔ f47 (polo GND)"/>
  <path d="M673 354 L700 382" class="linea"/><circle cx="673" cy="354" r="4" class="borne"/><circle cx="673" cy="390" r="4" class="borne"/>
  <circle cx="602" cy="354" r="4" class="borne"/>
  <circle cx="743" cy="354" r="4" class="borne"/>
  <circle cx="602" cy="390" r="4" class="borne"/>
  <circle cx="743" cy="390" r="4" class="borne"/>
  <text x="588" y="343" class="pequena" text-anchor="end">e45</text>
  <text x="588" y="395" class="pequena" text-anchor="end">e47</text>
  <text x="757" y="343" class="pequena" text-anchor="start">f45</text>
  <text x="757" y="382" class="pequena" text-anchor="start">f47</text>
  <path d="M748 390 H1103" class="cable gnd" data-conexion="f47 ↔ h47 → riel azul izquierdo"/>
  <circle cx="937" cy="390" r="4" fill="#243c59" stroke="none" stroke-width="2"/>
  <text x="937" y="414" class="nota" text-anchor="middle">h47</text>
  <circle cx="1103" cy="390" r="4" fill="#243c59" stroke="none" stroke-width="2"/>
  <circle cx="282" cy="453" r="5" class="borne"/>
  <text x="263" y="458" class="etiqueta" text-anchor="end">RX2 / GPIO16</text>
  <path d="M288 453 H602" class="cable dig" data-conexion="RX2 / GPIO16 → c50 ↔ e50"/>
  <text x="331" y="439" class="etiqueta" text-anchor="start">Verde</text>
  <text x="410" y="479" class="nota" text-anchor="middle">c50</text>
  <path d="M602 453 H743" class="cable dig" data-conexion="e50 ↔ f50 (polo de señal)"/>
  <path d="M602 489 H743" class="cable gnd" data-conexion="e52 ↔ f52 (polo GND)"/>
  <path d="M673 453 L700 481" class="linea"/><circle cx="673" cy="453" r="4" class="borne"/><circle cx="673" cy="489" r="4" class="borne"/>
  <circle cx="602" cy="453" r="4" class="borne"/>
  <circle cx="743" cy="453" r="4" class="borne"/>
  <circle cx="602" cy="489" r="4" class="borne"/>
  <circle cx="743" cy="489" r="4" class="borne"/>
  <text x="588" y="442" class="pequena" text-anchor="end">e50</text>
  <text x="588" y="494" class="pequena" text-anchor="end">e52</text>
  <text x="757" y="442" class="pequena" text-anchor="start">f50</text>
  <text x="757" y="481" class="pequena" text-anchor="start">f52</text>
  <path d="M748 489 H1103" class="cable gnd" data-conexion="f52 ↔ h52 → riel azul izquierdo"/>
  <circle cx="937" cy="489" r="4" fill="#243c59" stroke="none" stroke-width="2"/>
  <text x="937" y="513" class="nota" text-anchor="middle">h52</text>
  <circle cx="1103" cy="489" r="4" fill="#243c59" stroke="none" stroke-width="2"/>
  <circle cx="282" cy="552" r="5" class="borne"/>
  <text x="263" y="557" class="etiqueta" text-anchor="end">TX2 / GPIO17</text>
  <path d="M288 552 H602" class="cable dig" data-conexion="TX2 / GPIO17 → c55 ↔ e55"/>
  <text x="331" y="538" class="etiqueta" text-anchor="start">Inicio</text>
  <text x="410" y="578" class="nota" text-anchor="middle">c55</text>
  <path d="M602 552 H743" class="cable dig" data-conexion="e55 ↔ f55 (polo de señal)"/>
  <path d="M602 588 H743" class="cable gnd" data-conexion="e57 ↔ f57 (polo GND)"/>
  <path d="M673 552 L700 580" class="linea"/><circle cx="673" cy="552" r="4" class="borne"/><circle cx="673" cy="588" r="4" class="borne"/>
  <circle cx="602" cy="552" r="4" class="borne"/>
  <circle cx="743" cy="552" r="4" class="borne"/>
  <circle cx="602" cy="588" r="4" class="borne"/>
  <circle cx="743" cy="588" r="4" class="borne"/>
  <text x="588" y="541" class="pequena" text-anchor="end">e55</text>
  <text x="588" y="593" class="pequena" text-anchor="end">e57</text>
