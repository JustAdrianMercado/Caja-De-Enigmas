  <text x="757" y="580" class="pequena" text-anchor="start">f57</text>
  <path d="M748 588 H1103" class="cable gnd" data-conexion="f57 ↔ h57 → riel azul izquierdo"/>
  <circle cx="937" cy="588" r="4" fill="#243c59" stroke="none" stroke-width="2"/>
  <text x="937" y="612" class="nota" text-anchor="middle">h57</text>
  <circle cx="1103" cy="588" r="4" fill="#243c59" stroke="none" stroke-width="2"/>
  <path d="M1103 291 V630 H288" class="cable gnd" data-conexion="Riel azul izquierdo → GND ESP32"/>
  <circle cx="282" cy="630" r="5" class="borne"/>
  <text x="263" y="635" class="etiqueta" text-anchor="end">GND</text>
  <text x="1090" y="657" class="nota" text-anchor="end">Riel azul izquierdo</text>
  <text x="75" y="657" class="pequena" text-anchor="start">Entradas INPUT_PULLUP</text>
  <rect x="54" y="703" width="1091" height="99" rx="12" class="notaCaja"/><text x="71" y="729" class="etiqueta" text-anchor="start">Lectura en el ESP32</text><text x="71" y="754" class="nota" text-anchor="start">En reposo, el pull-up interno mantiene HIGH. Al presionar se unen los dos polos y se lee LOW.</text><text x="71" y="775" class="nota" text-anchor="start">Sin resistencias externas. Los jumpers de GND van a h42, h47, h52 y h57.</text>
  <path d="M55 834 h29" class="cable dig"/><text x="94" y="839" class="leyenda" text-anchor="start">Entrada digital</text><path d="M250 834 h29" class="cable gnd"/><text x="289" y="839" class="leyenda" text-anchor="start">GND común</text>
</svg>
