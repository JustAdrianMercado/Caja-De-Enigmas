[platformio]
default_envs = servo, reed
src_dir = ..
include_dir = ../include

[env]
platform = espressif32@7.0.1
platform_packages = platformio/framework-arduinoespressif32@3.20017.0
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
monitor_eol = LF
monitor_filters = send_on_enter

[env:servo]
build_src_filter =
    -<*>
    +<pruebas/servo/main.cpp>
lib_deps = madhephaestus/ESP32Servo@3.0.6

[env:reed]
build_src_filter =
    -<*>
    +<pruebas/reed/main.cpp>
    +<src/SensorTapa.cpp>

[env:pulsadores]
build_src_filter =
    -<*>
    +<pruebas/pulsadores/main.cpp>
    +<src/Pulsador.cpp>

[env:leds]
build_src_filter =
    -<*>
    +<pruebas/leds/main.cpp>
    +<src/IndicadorLeds.cpp>

[env:distancia]
build_src_filter =
    -<*>
    +<pruebas/distancia/main.cpp>
    +<src/SensorDistancia.cpp>

[env:luz]
build_src_filter =
    -<*>
    +<pruebas/luz/main.cpp>
    +<src/SensorLuz.cpp>

[env:desafios]
build_src_filter =
    -<*>
    +<pruebas/desafios/main.cpp>
    +<src/Pulsador.cpp>
    +<src/IndicadorLeds.cpp>
    +<src/SensorDistancia.cpp>
    +<src/SensorLuz.cpp>
    +<src/CerraduraServo.cpp>
    +<src/DesafioMemoria.cpp>
    +<src/DesafioDistancia.cpp>
    +<src/DesafioLuz.cpp>
    +<src/PartidaEnigmas.cpp>
    +<src/ParametrosJuego.cpp>
lib_deps = madhephaestus/ESP32Servo@3.0.6
